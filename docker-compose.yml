version: '3.9'

services:

  # ── Base de datos PostgreSQL local ───────────────────────────────
  db:
    image: postgres:16
    container_name: factulogin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       factulogin
      POSTGRES_USER:     factulogin_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factulogin_user -d factulogin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicación Node.js ────────────────────────────────────────────
  app:
    build: .
    container_name: factulogin-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:         production
      PORT:             3000
      DATABASE_URL:     postgresql://factulogin_user:${DB_PASSWORD:-changeme_in_production}@db:5432/factulogin?schema=public
      JWT_SECRET:       ${JWT_SECRET}
      ALLOWED_ORIGINS:  ${ALLOWED_ORIGINS:-http://localhost:3000}
      SMTP_HOST:        ${SMTP_HOST:-}
      SMTP_PORT:        ${SMTP_PORT:-587}
      SMTP_USER:        ${SMTP_USER:-}
      SMTP_PASS:        ${SMTP_PASS:-}
      SMTP_FROM:        ${SMTP_FROM:-}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>r.statusCode===200?process.exit(0):process.exit(1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pg_data:
  uploads_data:
