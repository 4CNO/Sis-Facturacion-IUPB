<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas — FactuLogin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="has-sidebar page-transition">

<nav class="sidebar" aria-label="Navegación principal">
    <span class="sidebar-logo">FactuLogin</span>
    <a href="menu.html"      class="sidebar-link"><i class="fa-solid fa-house" aria-hidden="true"></i><span class="sidebar-label">Inicio</span></a>
    <a href="clientes.html"  class="sidebar-link"><i class="fa-solid fa-users" aria-hidden="true"></i><span class="sidebar-label">Clientes</span></a>
    <a href="empresas.html"  class="sidebar-link active"><i class="fa-solid fa-building" aria-hidden="true"></i><span class="sidebar-label">Empresas</span></a>
    <a href="productos.html" class="sidebar-link"><i class="fa-solid fa-box" aria-hidden="true"></i><span class="sidebar-label">Productos</span></a>
    <a href="pedidos.html"   class="sidebar-link"><i class="fa-solid fa-receipt" aria-hidden="true"></i><span class="sidebar-label">Pedidos</span></a>
</nav>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>
<a href="menu.html" class="back-menu-btn">← Menú</a>

<div class="container form-centered">
    <div class="form">
        <h2>Empresas</h2>

        <div class="search-bar" role="search">
            <div class="search-input-wrap">
                <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                <input type="text" id="buscarNit" placeholder="Buscar por NIT…" autocomplete="off" aria-label="Buscar empresa por NIT">
                <button id="btnBuscar" class="search-btn">Buscar</button>
            </div>
            <span id="searchStatus" class="search-status" aria-live="polite"></span>
        </div>

        <div id="modoIndicador" class="modo-badge modo-nuevo" aria-live="polite">
            <i class="fa-solid fa-plus-circle" aria-hidden="true"></i> Modo: Nueva empresa
        </div>

        <div id="empresa-error" class="error-msg" style="display:none;" role="alert"></div>
        <div id="empresa-ok"    class="ok-msg"    style="display:none;" role="status"></div>

        <div class="input-group">
            <label for="nombreEmpresa">Nombre empresa</label>
            <input type="text" id="nombreEmpresa" placeholder="Ej: Tech Solutions S.A.S" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="nitEmpresa">NIT <span class="field-hint">(clave única)</span></label>
            <input type="text" id="nitEmpresa" placeholder="Ej: 900123456-7" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="telefonoEmpresa">Teléfono</label>
            <input type="text" id="telefonoEmpresa" placeholder="Ej: 6041234567" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="direccionEmpresa">Dirección</label>
            <input type="text" id="direccionEmpresa" placeholder="Ej: Calle 10 #5-20, Medellín" autocomplete="off">
        </div>

        <div class="btn-row">
            <button id="saveEmpresaBtn">
                <i class="fa-solid fa-floppy-disk" aria-hidden="true" style="margin-right:6px;"></i>
                <span id="saveBtnText">Guardar empresa</span>
            </button>
            <button id="clearBtn" class="btn-secondary" title="Limpiar formulario" aria-label="Limpiar formulario">
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
            </button>
        </div>

        <hr style="margin:20px 0;">

        <table aria-label="Lista de empresas">
            <thead>
                <tr><th scope="col">#</th><th scope="col">Empresa</th><th scope="col">NIT</th><th scope="col">Teléfono</th></tr>
            </thead>
            <tbody id="empresasBody"></tbody>
        </table>
        <p id="empresasEmpty" class="link" aria-live="polite">Aún no hay empresas</p>
    </div>
</div>

<script src="js/modules/utils.js"      defer></script>
<script src="js/modules/crud-module.js"  defer></script>
<script src="js/modules/empresas.js"   defer></script>
</body>
</html>
