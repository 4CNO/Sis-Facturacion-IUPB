<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos — FactuLogin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="has-sidebar page-transition">

<nav class="sidebar" aria-label="Navegación principal">
    <span class="sidebar-logo">FactuLogin</span>
    <a href="menu.html"      class="sidebar-link"><i class="fa-solid fa-house" aria-hidden="true"></i><span class="sidebar-label">Inicio</span></a>
    <a href="clientes.html"  class="sidebar-link"><i class="fa-solid fa-users" aria-hidden="true"></i><span class="sidebar-label">Clientes</span></a>
    <a href="empresas.html"  class="sidebar-link"><i class="fa-solid fa-building" aria-hidden="true"></i><span class="sidebar-label">Empresas</span></a>
    <a href="productos.html" class="sidebar-link active"><i class="fa-solid fa-box" aria-hidden="true"></i><span class="sidebar-label">Productos</span></a>
    <a href="pedidos.html"   class="sidebar-link"><i class="fa-solid fa-receipt" aria-hidden="true"></i><span class="sidebar-label">Pedidos</span></a>
</nav>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>
<a href="menu.html" class="back-menu-btn">← Menú</a>

<div class="container form-centered">
    <div class="form">
        <h2>Productos</h2>

        <div class="search-bar" role="search">
            <div class="search-input-wrap">
                <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                <input type="text" id="buscarId" placeholder="Buscar por ID de producto…" autocomplete="off" aria-label="Buscar producto por ID">
                <button id="btnBuscar" class="search-btn">Buscar</button>
            </div>
            <span id="searchStatus" class="search-status" aria-live="polite"></span>
        </div>

        <div id="modoIndicador" class="modo-badge modo-nuevo" aria-live="polite">
            <i class="fa-solid fa-plus-circle" aria-hidden="true"></i> Modo: Nuevo producto
        </div>

        <div id="producto-error" class="error-msg" style="display:none;" role="alert"></div>
        <div id="producto-ok"    class="ok-msg"    style="display:none;" role="status"></div>

        <!-- ID oculto en modo edición -->
        <div class="input-group" id="idGroup" style="display:none;">
            <label for="productoId">ID de producto <span class="field-hint">(asignado automáticamente)</span></label>
            <input type="text" id="productoId" readonly aria-readonly="true">
        </div>

        <div class="input-group">
            <label for="nombreProducto">Nombre del producto</label>
            <input type="text" id="nombreProducto" placeholder="Ej: Camiseta básica" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="marcaProducto">Marca</label>
            <input type="text" id="marcaProducto" placeholder="Ej: Nike" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="precioProducto">Precio unitario</label>
            <input type="number" id="precioProducto" min="0" step="0.01" placeholder="Ej: 59900" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="cantidadProducto">Cantidad en bodega</label>
            <input type="number" id="cantidadProducto" min="0" step="1" placeholder="Ej: 100" autocomplete="off">
        </div>

        <div class="btn-row">
            <button id="saveProductoBtn">
                <i class="fa-solid fa-floppy-disk" aria-hidden="true" style="margin-right:6px;"></i>
                <span id="saveBtnText">Guardar producto</span>
            </button>
            <button id="clearBtn" class="btn-secondary" title="Limpiar formulario" aria-label="Limpiar formulario">
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
            </button>
        </div>

        <hr style="margin:20px 0;">

        <table aria-label="Lista de productos">
            <thead>
                <tr><th scope="col">ID</th><th scope="col">Producto</th><th scope="col">Marca</th><th scope="col">Precio</th><th scope="col">Bodega</th></tr>
            </thead>
            <tbody id="productosBody"></tbody>
        </table>
        <p id="productosEmpty" class="link" aria-live="polite">Aún no hay productos</p>
    </div>
</div>

<script src="js/modules/utils.js"      defer></script>
<script src="js/modules/crud-module.js"  defer></script>
<script src="js/modules/productos.js"  defer></script>
</body>
</html>
