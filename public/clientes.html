<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes — FactuLogin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="has-sidebar page-transition">

<nav class="sidebar" aria-label="Navegación principal">
    <span class="sidebar-logo">FactuLogin</span>
    <a href="menu.html"      class="sidebar-link"><i class="fa-solid fa-house" aria-hidden="true"></i><span class="sidebar-label">Inicio</span></a>
    <a href="clientes.html"  class="sidebar-link active"><i class="fa-solid fa-users" aria-hidden="true"></i><span class="sidebar-label">Clientes</span></a>
    <a href="empresas.html"  class="sidebar-link"><i class="fa-solid fa-building" aria-hidden="true"></i><span class="sidebar-label">Empresas</span></a>
    <a href="productos.html" class="sidebar-link"><i class="fa-solid fa-box" aria-hidden="true"></i><span class="sidebar-label">Productos</span></a>
    <a href="pedidos.html"   class="sidebar-link"><i class="fa-solid fa-receipt" aria-hidden="true"></i><span class="sidebar-label">Pedidos</span></a>
</nav>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>
<a href="menu.html" class="back-menu-btn">← Menú</a>

<div class="container form-centered">
    <div class="form">
        <h2>Clientes</h2>

        <!-- Buscador -->
        <div class="search-bar" role="search">
            <div class="search-input-wrap">
                <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                <input type="text" id="buscarDoc" placeholder="Buscar por N° de documento…" autocomplete="off" aria-label="Buscar cliente por número de documento">
                <button id="btnBuscar" class="search-btn">Buscar</button>
            </div>
            <span id="searchStatus" class="search-status" aria-live="polite"></span>
        </div>

        <div id="modoIndicador" class="modo-badge modo-nuevo" aria-live="polite">
            <i class="fa-solid fa-plus-circle" aria-hidden="true"></i> Modo: Nuevo cliente
        </div>

        <div id="cliente-error" class="error-msg" style="display:none;" role="alert"></div>
        <div id="cliente-ok"    class="ok-msg"    style="display:none;" role="status"></div>

        <div class="input-group">
            <label for="nombreCliente">Nombre completo</label>
            <input type="text" id="nombreCliente" placeholder="Ej: Juan Pérez" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="documentoCliente">Documento <span class="field-hint">(clave única)</span></label>
            <input type="text" id="documentoCliente" placeholder="Ej: 1023456789" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="telefonoCliente">Teléfono</label>
            <input type="text" id="telefonoCliente" placeholder="Ej: 3001234567" autocomplete="off">
        </div>

        <div class="btn-row">
            <button id="saveClienteBtn">
                <i class="fa-solid fa-floppy-disk" aria-hidden="true" style="margin-right:6px;"></i>
                <span id="saveBtnText">Guardar cliente</span>
            </button>
            <button id="clearBtn" class="btn-secondary" title="Limpiar formulario" aria-label="Limpiar formulario">
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
            </button>
        </div>

        <hr style="margin:20px 0;">

        <table aria-label="Lista de clientes">
            <thead>
                <tr><th scope="col">#</th><th scope="col">Nombre</th><th scope="col">Documento</th><th scope="col">Teléfono</th></tr>
            </thead>
            <tbody id="clientesBody"></tbody>
        </table>
        <p id="clientesEmpty" class="link" aria-live="polite">Aún no hay clientes</p>
    </div>
</div>

<script src="js/modules/utils.js"     defer></script>
<script src="js/modules/crud-module.js" defer></script>
<script src="js/modules/clientes.js"  defer></script>
</body>
</html>
